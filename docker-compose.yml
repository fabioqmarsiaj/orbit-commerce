name: orbit-commerce

services:
  broker:
    image: apache/kafka:4.3.1
    container_name: orbit-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server broker:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - orbit-net

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: orbit-kafka-init
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: broker:19092
      TOPIC_PARTITIONS: 3
      TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    networks:
      - orbit-net
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.13
    container_name: orbit-schema-registry
    ports:
      - "8081:8081"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - orbit-net

  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - orbit-net

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: orbit-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: orbit-commerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - orbit-net

  # ---------------------------------------------------------------
  # Phase 9: the 5 Java services, dockerized. All under the `apps`
  # Compose profile — plain `docker compose up -d` (today's exact
  # command) keeps bringing up ONLY the infra above, zero change to the
  # established bootRun-based dev workflow. `docker compose --profile
  # apps up -d --build` brings up everything, apps included, for
  # end-to-end observability testing. ingestion-service (Go) stays
  # undockerized this phase — see docs/decisions.md ("Phase 9 —
  # Observability").
  # ---------------------------------------------------------------

  order-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: orbit-order-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP: broker:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - orbit-net

  inventory-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: orbit-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP: broker:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - orbit-net

  payment-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: orbit-payment-service
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP: broker:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - orbit-net

  shipping-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    container_name: orbit-shipping-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP: broker:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - orbit-net

  query-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: query-service/Dockerfile
    container_name: orbit-query-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP: broker:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - orbit-net

  # ---------------------------------------------------------------
  # Phase 9: observability stack (Prometheus, Grafana, kafka-exporter).
  # Also under the `apps` profile — a Prometheus instance with no Java
  # services running has nothing useful to scrape (all targets DOWN), so
  # it makes more sense bundled with the apps themselves. `docker compose
  # --profile apps up -d --build` is the single command that brings up
  # the entire observable system. See docs/decisions.md ("Phase 9 —
  # Observability").
  # ---------------------------------------------------------------

  prometheus:
    profiles: ["apps"]
    image: prom/prometheus:v3.14.0
    container_name: orbit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipping-service:
        condition: service_started
      query-service:
        condition: service_started
    networks:
      - orbit-net

  kafka-exporter:
    profiles: ["apps"]
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: orbit-kafka-exporter
    command: ["--kafka.server=broker:19092"]
    ports:
      - "9308:9308"
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - orbit-net

  grafana:
    profiles: ["apps"]
    image: grafana/grafana:13.2.1
    container_name: orbit-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - orbit-net

networks:
  orbit-net:
    name: orbit-commerce-net

volumes:
  kafka-data:
  postgres-data:
