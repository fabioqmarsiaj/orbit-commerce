spring.application.name=order-service
server.port=8082

# --- Datasource (order_db, created by infra/postgres/init-databases.sh) ---
# DB_HOST defaults to localhost (today's bootRun-against-Dockerized-infra
# workflow, unchanged); the Compose `apps` profile (Phase 9) overrides it to
# `postgres`, the in-network service DNS name.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/order_db
spring.datasource.username=orbit
spring.datasource.password=orbit

# `update` is convenient while iterating on the schema during Phase 2;
# revisit this (e.g. Flyway/Liquibase migrations) before this is anything
# resembling a production setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Kafka ---
# KAFKA_BOOTSTRAP defaults to localhost:9092 (the broker's external
# PLAINTEXT_HOST listener, used by bootRun on the host); the Compose `apps`
# profile overrides it to `broker:19092`, the internal PLAINTEXT listener.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

# Producer: used both by OrderCommandService (to send Saga commands to
# inventory/payment/shipping) and OutboxPublisher (to publish integration
# events on order.events). Values are Avro-encoded and registered against
# the Schema Registry.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
# SCHEMA_REGISTRY_URL defaults to http://localhost:8081; the Compose `apps`
# profile overrides it to http://schema-registry:8081 (in-network DNS name).
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# Several topics (order.events, inventory.commands, payment.commands,
# shipping.commands) carry more than one Avro record type. The default
# subject naming strategy (TopicNameStrategy) puts every message on a
# topic under ONE subject (e.g. "order.events-value") and enforces schema
# COMPATIBILITY between whatever gets published there — which breaks the
# moment two structurally different record types (e.g. OrderCreated and
# OrderCancelled) are both published to the same topic. RecordNameStrategy
# uses the Avro record's fully-qualified name as the subject instead (e.g.
# "com.fabioqmarsiaj.events.order.OrderCreated"), so each event type gets
# its own independent subject/compatibility history. Only needs to be set
# on the producer side — consumers resolve schemas by the numeric ID
# embedded in the Confluent wire format, not by subject/strategy. See
# docs/decisions.md for the full writeup.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy

# Consumer: used by the messaging listeners reacting to inventory/payment/
# shipping events. specific.avro.reader=true makes the Avro deserializer
# hand us the generated classes (e.g. StockReserved) directly, instead of
# generic Avro GenericRecord instances.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=earliest

# --- Outbox poller ---
outbox.publisher.fixed-delay-ms=2000

# --- Actuator / Metrics ---
management.endpoints.web.exposure.include=health,prometheus
# Exports http.server.requests as a cumulative histogram (the
# http_server_requests_seconds_bucket series), not just _count/_sum/_max —
# needed for the Grafana JVM/HTTP dashboard's p95 latency panel
# (histogram_quantile(...) has no buckets to work with otherwise). Same
# reasoning as orbit.saga.duration's own publishPercentileHistogram() in
# OrderCommandService — see docs/decisions.md ("Phase 9 — Observability").
management.metrics.distribution.percentiles-histogram.http.server.requests=true
