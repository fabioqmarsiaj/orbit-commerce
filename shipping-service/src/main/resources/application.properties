spring.application.name=shipping-service
server.port=8085

# --- Datasource (shipping_db, created by infra/postgres/init-databases.sh) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/shipping_db
spring.datasource.username=orbit
spring.datasource.password=orbit

# `update` is convenient while iterating on the schema during Phase 5;
# revisit this (e.g. Flyway/Liquibase migrations) before this is anything
# resembling a production setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

# Producer: used by OutboxPublisher to publish integration events on
# shipping.events. Values are Avro-encoded and registered against the
# Schema Registry.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081

# shipping.events carries more than one Avro record type (ShipmentCreated/
# ShipmentFailed). See order-service's application.properties and
# docs/decisions.md for the full explanation of why RecordNameStrategy is
# required for any topic that carries more than one event type.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy

# Consumer: used by ShippingCommandListener reacting to Saga commands on
# shipping.commands. specific.avro.reader=true makes the Avro deserializer
# hand us the generated classes (e.g. CreateShipmentCommand) directly,
# instead of generic Avro GenericRecord instances.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=shipping-service

# --- Outbox poller ---
outbox.publisher.fixed-delay-ms=2000

# --- Shipment creation simulation ---
# CreateShipmentCommand carries no business field (amount, items, etc.) to
# key a realistic success/failure decision on - unlike inventory-service's
# stock check or payment-service's amount threshold. Instead, a sentinel
# customerId forces a simulated failure, giving deterministic per-request
# control over the compensation path during manual testing (just use this
# customerId in POST /orders) without needing to restart the service.
shipping.simulation.force-fail-customer-id=fail-customer
