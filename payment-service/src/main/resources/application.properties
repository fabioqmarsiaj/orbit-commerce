spring.application.name=payment-service
server.port=8084

# --- Datasource (payment_db, created by infra/postgres/init-databases.sh) ---
# DB_HOST defaults to localhost (today's bootRun-against-Dockerized-infra
# workflow, unchanged); the Compose `apps` profile (Phase 9) overrides it to
# `postgres`, the in-network service DNS name.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/payment_db
spring.datasource.username=orbit
spring.datasource.password=orbit

# `update` is convenient while iterating on the schema during Phase 4;
# revisit this (e.g. Flyway/Liquibase migrations) before this is anything
# resembling a production setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Kafka ---
# KAFKA_BOOTSTRAP defaults to localhost:9092 (the broker's external
# PLAINTEXT_HOST listener, used by bootRun on the host); the Compose `apps`
# profile overrides it to `broker:19092`, the internal PLAINTEXT listener.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

# Producer: used by OutboxPublisher to publish integration events on
# payment.events. Values are Avro-encoded and registered against the
# Schema Registry.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
# SCHEMA_REGISTRY_URL defaults to http://localhost:8081; the Compose `apps`
# profile overrides it to http://schema-registry:8081 (in-network DNS name).
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# payment.events carries more than one Avro record type (PaymentApproved/
# PaymentDeclined/PaymentRefunded). See order-service's application.properties
# and docs/decisions.md for the full explanation of why RecordNameStrategy
# is required for any topic that carries more than one event type.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy

# Consumer: used by PaymentCommandListener reacting to Saga commands on
# payment.commands. specific.avro.reader=true makes the Avro deserializer
# hand us the generated classes (e.g. ProcessPaymentCommand) directly,
# instead of generic Avro GenericRecord instances.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=payment-service

# --- Outbox poller ---
outbox.publisher.fixed-delay-ms=2000

# --- Payment approval rule ---
# Simple simulated rule: amountCents above this limit is declined. Easy to
# lower temporarily (no recompile needed) to force a PaymentDeclined during
# manual testing of the Saga's compensation path.
payment.approval.limit-cents=100000

# --- Actuator / Metrics ---
management.endpoints.web.exposure.include=health,prometheus
# Exports http.server.requests as a cumulative histogram — needed for the
# Grafana JVM/HTTP dashboard's p95 latency panel. See order-service's
# application.properties and docs/decisions.md ("Phase 9 — Observability").
management.metrics.distribution.percentiles-histogram.http.server.requests=true
