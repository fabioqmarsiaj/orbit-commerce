# Phase 9: Prometheus scrape configuration.
#
# Targets use Docker-network service DNS names (not host.docker.internal),
# since the `apps` Compose profile puts Prometheus and the 5 Java services
# on the same `orbit-net` network — see docs/decisions.md ("Phase 9 —
# Observability").

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8082"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8083"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8084"]

  - job_name: shipping-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shipping-service:8085"]

  - job_name: query-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["query-service:8086"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
