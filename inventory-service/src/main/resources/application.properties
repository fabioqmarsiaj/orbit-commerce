spring.application.name=inventory-service
server.port=8083

# --- Datasource (inventory_db, created by infra/postgres/init-databases.sh) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=orbit
spring.datasource.password=orbit

# `update` is convenient while iterating on the schema during Phase 3;
# revisit this (e.g. Flyway/Liquibase migrations) before this is anything
# resembling a production setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

# Producer: used by OutboxPublisher to publish integration events on
# inventory.events. Values are Avro-encoded and registered against the
# Schema Registry.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081

# inventory.events carries more than one Avro record type (StockReserved/
# StockRejected/StockReleased). See order-service's application.properties
# and docs/decisions.md for the full explanation of why RecordNameStrategy
# is required for any topic that carries more than one event type.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy

# Consumer: used by InventoryCommandListener reacting to Saga commands on
# inventory.commands. specific.avro.reader=true makes the Avro deserializer
# hand us the generated classes (e.g. ReserveStockCommand) directly,
# instead of generic Avro GenericRecord instances.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=inventory-service

# --- Outbox poller ---
outbox.publisher.fixed-delay-ms=2000
