spring.application.name=query-service
server.port=8086

# --- Datasource (query_db, created by infra/postgres/init-databases.sh) ---
# DB_HOST defaults to localhost (today's bootRun-against-Dockerized-infra
# workflow, unchanged); the Compose `apps` profile (Phase 9) overrides it to
# `postgres`, the in-network service DNS name.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/query_db
spring.datasource.username=orbit
spring.datasource.password=orbit

# `update` is convenient while iterating on the schema during Phase 7;
# revisit this (e.g. Flyway/Liquibase migrations) before this is anything
# resembling a production setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Kafka ---
# KAFKA_BOOTSTRAP defaults to localhost:9092 (the broker's external
# PLAINTEXT_HOST listener, used by bootRun on the host); the Compose `apps`
# profile overrides it to `broker:19092`, the internal PLAINTEXT listener.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

# query-service is a pure read-model consumer: it never publishes domain
# events back to Kafka, so unlike every other service in this project
# there's no [Producer] section here, no KafkaTemplate, and no dependency
# on outbox-support (that module's whole API is producer-side only - see
# docs/decisions.md, "Phase 7 — query-service").
#
# Consumer: used by the Order/Inventory/Payment/ShippingEventListener
# classes materializing the read model from order.events/inventory.events/
# payment.events/shipping.events. specific.avro.reader=true makes the Avro
# deserializer hand us the generated classes (e.g. OrderCreated) directly,
# instead of generic Avro GenericRecord instances.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=query-service

# --- Kafka Streams (Part B: user-activity.events analytics) ---
# Spring Boot has NO auto-configuration for Kafka Streams (confirmed by
# inspection - unlike the @KafkaListener-based consumers above, which are
# auto-configured); UserActivityStreamsConfig wires this up manually via
# @EnableKafkaStreams + a KafkaStreamsConfiguration bean reading these
# properties. user-activity.events carries 3 different Avro types
# (ProductViewed/AddedToCart/SearchPerformed sharing one topic, same
# multi-type-topic shape as every other topic in this project), so the
# value serde here is GenericAvroSerde (not SpecificAvroSerde) - the
# topology filters down to ProductViewed by inspecting
# GenericRecord.getSchema().getName() itself, the Kafka-Streams-side
# equivalent of the eventType discriminator pattern used everywhere else
# in this project (outbox rows, order-service's event store, query-service's
# own timeline_entries table).
spring.kafka.streams.application-id=query-service-streams
spring.kafka.streams.properties.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties.default.value.serde=io.confluent.kafka.streams.serdes.avro.GenericAvroSerde
spring.kafka.streams.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.streams.properties.specific.avro.reader=false

# --- Actuator / Metrics ---
management.endpoints.web.exposure.include=health,prometheus
# Exports http.server.requests as a cumulative histogram — needed for the
# Grafana JVM/HTTP dashboard's p95 latency panel. See order-service's
# application.properties and docs/decisions.md ("Phase 9 — Observability").
management.metrics.distribution.percentiles-histogram.http.server.requests=true
